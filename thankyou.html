<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You – Dhulikhel Village Resort</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #faf7f2;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }
        .card {
            background: white;
            border-radius: 16px;
            padding: 3.5rem 3rem;
            max-width: 520px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
        }
        .icon { font-size: 4rem; margin-bottom: 1.2rem; }
        h1 { font-family: 'Cinzel', serif; font-size: 1.8rem; color: #1e2229; margin-bottom: 0.8rem; }
        p { color: #6b7280; line-height: 1.7; margin-bottom: 1.5rem; }
        .highlight { color: #a8422b; font-weight: 600; }
        .btn {
            display: inline-block;
            background: #a8422b;
            color: white;
            padding: 0.85rem 2rem;
            border-radius: 4px;
            font-weight: 600;
            text-decoration: none;
            margin: 0.4rem;
            transition: background 0.2s;
        }
        .btn:hover { background: #822f1c; }
        .btn-wa {
            background: #25D366;
        }
        .btn-wa:hover { background: #1da851; }
        .divider { border: none; border-top: 1px solid #e5dfd5; margin: 2rem 0; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">🏔️</div>
        <h1>Thank You for Your Inquiry!</h1>
        <p>
            Your booking request has been received. Our team at
            <span class="highlight">Dhulikhel Village Resort</span> will get back to you
            at <span class="highlight">Info.dhulikhelvillageresort@gmail.com</span> within <strong>24 hours</strong>.
        </p>
        <p>For immediate assistance, reach us directly on WhatsApp:</p>
        <a href="https://wa.me/9779851075181?text=Hello%21%20I%20just%20submitted%20a%20booking%20inquiry%20on%20your%20website." class="btn btn-wa" target="_blank">
            💬 Chat on WhatsApp
        </a>
        <hr class="divider">
        <a href="index.html" class="btn">← Back to Website</a>
    </div>
</body>
</html>
